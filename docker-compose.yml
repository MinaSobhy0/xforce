version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: laserbase-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laserbase
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: laserbase-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - laserbase
    depends_on:
      - app

  postgres:
    image: postgres:16
    container_name: laserbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laserbase
      POSTGRES_USER: laserbase
      POSTGRES_PASSWORD: secret
      POSTGRES_MULTIPLE_DATABASES: laserbase_testing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - laserbase

  redis:
    image: redis:7-alpine
    container_name: laserbase-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laserbase

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: laserbase-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - laserbase

  mailhog:
    image: mailhog/mailhog
    container_name: laserbase-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - laserbase

  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: laserbase-horizon
    restart: unless-stopped
    command: php artisan horizon
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laserbase
    depends_on:
      - postgres
      - redis

networks:
  laserbase:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local